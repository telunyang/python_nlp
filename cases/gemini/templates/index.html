<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>Assistant Chat Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        #chat {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            min-height: 500px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .message::before {
            content: attr(data-label) "：";
            font-weight: bold;
        }

        .user {
            background: #dbeafe;
            text-align: right;
        }

        .assistant {
            background: #eeeeee;
        }

        #form {
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }

        #input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
        }

        .cursor::after {
            content: "▍";
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="chat"></div>

    <form id="form">
        <input id="input" type="text" placeholder="請輸入訊息">
        <button type="submit">送出</button>
        <button type="button" id="clear">清除</button>
    </form>

    <script>
        const chatDiv = document.getElementById("chat");
        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const clearBtn = document.getElementById("clear");

        function getRoleLabel(role) {
            if (role === "user") return "你";
            if (role === "assistant") return "機器人";
            return role;
        }

        function addMessage(role, text) {
            const div = document.createElement("div");

            div.className = "message " + role;
            div.dataset.label = getRoleLabel(role);
            div.textContent = text;

            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;

            return div;
        }

        async function loadHistory() {
            const response = await fetch("/api/history");
            const history = await response.json();

            chatDiv.innerHTML = "";

            history.forEach(msg => {
                addMessage(msg.role, msg.text);
            });
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            input.value = "";

            addMessage("user", message);

            const assistantDiv = addMessage("assistant", "");
            assistantDiv.classList.add("cursor");

            const response = await fetch("/api/chat/stream", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            while (true) {
                const result = await reader.read();

                if (result.done) {
                    break;
                }

                const chunk = decoder.decode(result.value);
                assistantDiv.textContent += chunk;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }

            assistantDiv.classList.remove("cursor");
        });

        clearBtn.addEventListener("click", async function () {
            await fetch("/api/clear", {
                method: "POST"
            });

            chatDiv.innerHTML = "";
        });

        loadHistory();
    </script>

</body>

</html>
